services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: jobs
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:pass@db:5432/jobs
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata: {}
